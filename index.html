<title>O&amp;M Manual Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:wght@500&family=Public+Sans:wght@400;600&display=swap');

  :root{
    --accent:#2b6cb0;
    --accent-deep:#173350;
    --accent-soft:#dbe9f8;
    --accent-soft-ink:#1c4d78;
    --bg:#f3f6f9;
    --surface:#ffffff;
    --surface-2:#eef2f6;
    --ink:#1b2530;
    --ink-soft:#5c6b7a;
    --ink-faint:#8996a3;
    --border:#dde4ea;
    --border-strong:#c4ced7;
    --success:#1f7a4d;
    --success-soft:#e1f3e8;
    --warn:#a2660a;
    --warn-soft:#fbedd6;
    --pending:#6b7684;
    --pending-soft:#e7ebee;
    --danger:#a4342f;
    --shadow-sm: 0 1px 2px rgba(23,51,80,.06);
    --shadow-md: 0 4px 16px rgba(23,51,80,.10);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --accent:#5b9bdb;
      --accent-deep:#bcdcff;
      --accent-soft:#193049;
      --accent-soft-ink:#a9d3fb;
      --bg:#11161d;
      --surface:#181f28;
      --surface-2:#1f2833;
      --ink:#e7edf3;
      --ink-soft:#a7b3bf;
      --ink-faint:#76838f;
      --border:#2a333e;
      --border-strong:#3a4550;
      --success:#4cbb82;
      --success-soft:#173226;
      --warn:#d9a441;
      --warn-soft:#332608;
      --pending:#8b96a3;
      --pending-soft:#232b34;
      --danger:#e0726c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --accent:#5b9bdb;
    --accent-deep:#bcdcff;
    --accent-soft:#193049;
    --accent-soft-ink:#a9d3fb;
    --bg:#11161d;
    --surface:#181f28;
    --surface-2:#1f2833;
    --ink:#e7edf3;
    --ink-soft:#a7b3bf;
    --ink-faint:#76838f;
    --border:#2a333e;
    --border-strong:#3a4550;
    --success:#4cbb82;
    --success-soft:#173226;
    --warn:#d9a441;
    --warn-soft:#332608;
    --pending:#8b96a3;
    --pending-soft:#232b34;
    --danger:#e0726c;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  .mono{font-family:'IBM Plex Mono', 'SF Mono', monospace;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;}

  .sidebar{
    width:288px;flex:none;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    height:100vh;position:sticky;top:0;
  }
  .brand{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    display:flex;align-items:center;gap:10px;
  }
  .brand-glyph{
    width:34px;height:34px;border-radius:8px;flex:none;
    background:linear-gradient(155deg, var(--accent) 0%, var(--accent-deep) 100%);
    position:relative;overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .brand-glyph svg{position:absolute;inset:0;}
  .brand-name{font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.15;}
  .brand-sub{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

  .sidebar-tools{padding:14px 16px 8px;}
  .new-job-btn{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    transition:filter .12s ease, transform .05s ease;
  }
  .new-job-btn:hover{filter:brightness(1.07);}
  .new-job-btn:active{transform:scale(.98);}

  .job-list{flex:1;overflow-y:auto;padding:4px 10px 16px;}
  .job-list-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);padding:14px 10px 6px;}
  .job-item{
    padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:3px;
    border:1px solid transparent;
    transition:background .12s ease;
  }
  .job-item:hover{background:var(--surface-2);}
  .job-item.active{background:var(--accent-soft);border-color:var(--accent-soft);}
  .job-item-name{font-weight:600;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-item.active .job-item-name{color:var(--accent-soft-ink);}
  .job-item-meta{display:flex;align-items:center;gap:6px;margin-top:5px;}
  .job-item-bar{flex:1;height:4px;border-radius:2px;background:var(--pending-soft);overflow:hidden;}
  .job-item-bar-fill{height:100%;background:var(--success);border-radius:2px;}
  .job-item-pct{font-size:10.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
  .job-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .job-item-done{flex:0 0 auto;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--success);background:var(--success-soft, rgba(34,197,94,.14));border-radius:999px;padding:2px 7px;}
  .job-item-ago{font-size:10px;color:var(--ink-faint);margin-top:3px;}
  .dup-warning{display:flex;align-items:flex-start;gap:10px;background:var(--pending-soft);border:1px solid var(--pending-border, rgba(217,119,6,.3));border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12.5px;line-height:1.5;}
  .dup-warning b{display:block;margin-bottom:2px;}
  .dup-warning-actions{margin-top:6px;display:flex;gap:8px;}
  .dup-warning button{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;}
  .dup-warning button:hover{background:var(--surface-2);}
  .job-empty{padding:20px 12px;color:var(--ink-faint);font-size:12.5px;line-height:1.5;}
  .job-empty-sm{padding:2px 10px 14px;font-size:11.5px;}
  .job-list-label-done{color:var(--success);display:flex;align-items:center;gap:5px;}
  .job-list-label-done::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);flex:none;}

  .sidebar-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-faint);line-height:1.5;}
  .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pending);margin-right:6px;}
  .sync-dot.live{background:var(--success);}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:18px 32px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:var(--surface);position:sticky;top:0;z-index:5;
  }
  .topbar-title-row{display:flex;align-items:baseline;gap:12px;min-width:0;}
  .job-title-input{
    font-size:21px;font-weight:700;letter-spacing:-.01em;border:none;background:transparent;
    color:var(--ink);padding:2px 4px;border-radius:6px;min-width:120px;max-width:52ch;
  }
  .job-title-input:hover, .job-title-input:focus{background:var(--surface-2);}
  .doc-no{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);white-space:nowrap;}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex:none;}
  .btn{
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
    display:inline-flex;align-items:center;gap:7px;transition:background .12s ease,border-color .12s ease;
  }
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.07);background:var(--accent);}
  .btn-danger-ghost{color:var(--danger);border-color:transparent;background:transparent;}
  .btn-danger-ghost:hover{background:var(--warn-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .content{flex:1;overflow-y:auto;padding:28px 32px 80px;}
  .content-inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}

  /* progress strip */
  .progress-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow-sm);
  }
  .progress-ring{flex:none;}
  .progress-copy{flex:1;}
  .progress-copy-title{font-weight:600;font-size:14px;}
  .progress-copy-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .progress-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .chip{
    font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600;
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip-dot{width:6px;height:6px;border-radius:50%;}
  .chip.complete{background:var(--success-soft);color:var(--success);}
  .chip.complete .chip-dot{background:var(--success);}
  .chip.pending{background:var(--pending-soft);color:var(--pending);}
  .chip.pending .chip-dot{background:var(--pending);}
  .chip.awaiting{background:var(--warn-soft);color:var(--warn);}
  .chip.awaiting .chip-dot{background:var(--warn);}

  /* section cards */
  .section{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .section-head{
    padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;
  }
  .section-num{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);
    background:var(--accent-soft);color:var(--accent-soft-ink);
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:600;
  }
  .section-titles{flex:1;min-width:0;}
  .section-title{font-weight:600;font-size:14.5px;}
  .section-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .section-chevron{color:var(--ink-faint);transition:transform .15s ease;flex:none;}
  .section.open .section-chevron{transform:rotate(90deg);}
  .section-body{padding:0 20px 20px;display:none;}
  .section.open .section-body{display:block;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .field-grid.span-1{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .field input, .field textarea, .field select{
    font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:7px;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
    width:100%;
  }
  .field textarea{resize:vertical;min-height:60px;line-height:1.5;}
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field-note{font-size:11px;color:var(--ink-faint);}

  .divider-label{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
    margin:16px 0 8px;padding-top:14px;border-top:1px dashed var(--border);
  }
  .divider-label:first-child{border-top:none;padding-top:0;margin-top:0;}

  /* equipment table */
  .eq-table{width:100%;border-collapse:collapse;font-size:13px;}
  .eq-table th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);
    padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600;
  }
  .eq-table td{padding:5px 8px;border-bottom:1px solid var(--border);}
  .eq-table input, .eq-table select{
    border:1px solid transparent;background:transparent;padding:6px 7px;border-radius:6px;font-size:13px;width:100%;font-family:inherit;color:var(--ink);
  }
  .eq-table input:hover,.eq-table select:hover{background:var(--surface-2);}
  .eq-table input:focus,.eq-table select:focus{border-color:var(--accent);background:var(--surface);}
  .eq-table tr:last-child td{border-bottom:none;}
  .eq-row-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
  .eq-row-del:hover{color:var(--danger);background:var(--warn-soft);}
  .eq-add-row{
    margin-top:10px;font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:1px dashed var(--border-strong);
    padding:8px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .eq-add-row:hover{background:var(--accent-soft);border-color:var(--accent);}
  .eq-add-row input[type="file"]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

  .file-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .file-row{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);
  }
  .file-name{flex:1;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-size{font-size:11px;color:var(--ink-faint);}
  .file-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:5px;border-radius:6px;display:flex;}
  .file-btn:hover{background:var(--surface);color:var(--accent);}
  .file-btn-del:hover{color:var(--danger);}

  .link-add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .link-add-row .link-add-label{flex:1 1 220px;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);}
  .link-add-row .link-add-url{flex:2 1 260px;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);}
  .link-add-row .link-add-label:focus, .link-add-row .link-add-url:focus{border-color:var(--accent);}

  /* status pills for appendix sections */
  .status-row{display:flex;gap:8px;margin-bottom:12px;}
  .status-btn{
    flex:1;padding:9px 8px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);text-align:center;
    transition:all .1s ease;
  }
  .status-btn:hover{background:var(--surface-2);}
  .status-btn.sel-pending{background:var(--pending-soft);border-color:var(--pending);color:var(--pending);}
  .status-btn.sel-awaiting{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
  .status-btn.sel-complete{background:var(--success-soft);border-color:var(--success);color:var(--success);}

  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:90px 20px;text-align:center;color:var(--ink-faint);gap:14px;
  }
  .empty-state svg{opacity:.55;}
  .empty-state h2{font-size:17px;color:var(--ink);font-weight:600;margin:0;}
  .empty-state p{font-size:13.5px;max-width:38ch;line-height:1.5;margin:0;}

  .info-banner{
    display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-soft-ink);
    border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.5;
  }
  .info-banner svg{flex:none;margin-top:1px;}
  .info-banner b{font-weight:700;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,32,.45);display:flex;align-items:center;justify-content:center;z-index:60;
    padding:20px;
  }
  .modal{background:var(--surface);border-radius:12px;padding:24px;width:100%;max-width:420px;box-shadow:var(--shadow-md);}
  .modal h3{margin:0 0 4px;font-size:16px;}
  .modal p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .modal-lg{max-width:760px;max-height:88vh;display:flex;flex-direction:column;padding:0;}
  .modal-lg-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 22px;border-bottom:1px solid var(--border);flex:none;
  }
  .modal-lg-head h3{margin:0;font-size:15.5px;}
  .modal-lg-close{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:6px;border-radius:7px;display:flex;
  }
  .modal-lg-close:hover{background:var(--surface-2);color:var(--ink);}
  .modal-lg-body{overflow-y:auto;padding:22px;flex:1;}
  .modal-lg-foot{
    display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);flex:none;
  }

  .preview-doc{font-family:'Public Sans',Arial,sans-serif;font-size:13px;line-height:1.6;color:#333b47;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .preview-doc > *{padding-left:34px;padding-right:34px;}
  .preview-doc > .preview-cover{padding-left:0;padding-right:0;}
  .preview-cover{padding:0 !important;margin-bottom:0;background:#fff;text-align:left;}
  .preview-cover .pc-panel{position:relative;background:#0a1a4d;padding:30px 34px 24px;min-height:0;display:flex;flex-direction:column;justify-content:space-between;}
  .preview-cover .pc-logo{width:36%;height:auto;display:block;}
  .preview-cover .pc-bottom{margin-top:16px;}
  .preview-cover .pc-meta{position:absolute;top:30px;right:34px;display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:#fff;}
  .preview-cover .pc-eb{font-size:10px;font-weight:600;letter-spacing:.16em;color:#12aef4;}
  .preview-cover .pc-tag{font-family:'Public Sans',Arial,sans-serif;font-size:13px;font-weight:600;color:#fff;margin:0;}
  .preview-cover .pc-body{padding:34px 34px 30px;}
  .preview-cover .pc-eyebrow{font-family:'Public Sans',Arial,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0b4fd4;}
  .preview-cover .pc-title{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-.02em;color:#0a1a4d;margin-top:12px;}
  .preview-cover .pc-job{font-family:'Public Sans',Arial,sans-serif;font-size:17px;font-weight:600;margin-top:14px;color:#14181e;}
  .preview-cover .pc-details{border-top:1px solid #dfe4ec;margin-top:18px;padding-top:14px;font-family:'Public Sans',Arial,sans-serif;font-size:12px;color:#333b47;line-height:1.9;}
  .preview-cover .pc-details b{display:inline-block;width:130px;font-size:11px;color:#6b7688;font-weight:600;}
  .preview-cover .pc-address{font-family:'Public Sans',Arial,sans-serif;font-size:11.5px;color:#6b7688;margin-top:40px;line-height:1.7;}
  .preview-cover .pc-address strong{color:#0a1a4d;}
  .preview-pagebreak{border-top:2px dashed var(--border);margin:0;position:relative;}
  .preview-pagebreak::after{
    content:'Page break';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:var(--surface,#fff);padding:0 10px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
  }
  .preview-innerhead{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    padding-top:22px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid #dfe4ec;
  }
  .preview-innerhead .pih-title{font-family:'Public Sans',Arial,sans-serif;font-size:12px;font-weight:600;color:#0a1a4d;}
  .preview-innerhead .pih-job{font-size:11px;color:var(--ink-faint);margin-top:2px;}
  .preview-innerhead .pih-logo{height:28px;width:auto;flex:none;}
  .preview-h{
    font-family:'Newsreader',Georgia,serif;font-size:18px;font-weight:500;letter-spacing:-.01em;color:#0a1a4d;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid #dfe4ec;
  }
  .preview-h:first-child{margin-top:0;}
  .preview-sub{font-family:'Public Sans',Arial,sans-serif;font-size:12.5px;font-weight:600;color:#0b4fd4;margin:14px 0 6px;}
  .preview-doc p{margin:0 0 8px;}
  .preview-table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:12.5px;}
  .preview-table th, .preview-table td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top;}
  .preview-table th{background:var(--surface-2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  .preview-appendix{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .preview-appendix-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .preview-appendix-title{font-weight:600;font-size:13px;}
  .preview-mini-list{margin:6px 0 0;padding-left:18px;font-size:12.5px;}
  .preview-mini-list li{margin-bottom:2px;}
  .preview-mini-list a{color:var(--accent);text-decoration:none;}
  .preview-empty{color:var(--ink-faint);font-style:italic;}

  .mobile-bar{display:none;}

  @media (max-width: 640px){
    .mobile-bar{
      display:flex;align-items:center;gap:10px;padding:12px 16px;
      border-bottom:1px solid var(--border);background:var(--surface);
      position:sticky;top:0;z-index:20;
    }
    .mobile-bar-btn{
      border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;
      padding:7px 9px;cursor:pointer;color:var(--ink);display:flex;
    }
    .mobile-bar-title{font-weight:700;font-size:14px;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow-md);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,32,.4);z-index:35;}
    .sidebar-backdrop.show{display:block;}
    .field-grid{grid-template-columns:1fr;}
    .content{padding:20px 16px 80px;}
    .topbar{padding:14px 16px;flex-wrap:wrap;}
  }
</style>

  function matchWarranty(manufacturer){
    if (!manufacturer) return null;
    var m = manufacturer.toLowerCase();
    for (var i=0;i<WARRANTY_LIBRARY.length;i++){
      var entry = WARRANTY_LIBRARY[i];
      for (var j=0;j<entry.match.length;j++){
        if (m.indexOf(entry.match[j]) !== -1) return entry;
      }
    }
    return null;
  }

  function warrantyLibraryPanel(job){
    var manufacturers = [];
    (job.equipment||[]).forEach(function(r){
      var m = (r.manufacturer||'').trim();
      if (m && manufacturers.indexOf(m) === -1) manufacturers.push(m);
    });
    if (!manufacturers.length){
      return '<div class="info-banner" style="margin-bottom:14px;">' +
        '<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 6.8V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7.5" cy="4.6" r="0.9" fill="currentColor"/></svg>' +
        '<div>Add equipment to the schedule above and matching warranty terms (Daikin, Fantech, Fujitsu General, Mitsubishi Electric on file) will appear here to insert.</div>' +
      '</div>';
    }
    var rows = manufacturers.map(function(m){
      var entry = matchWarranty(m);
      if (entry){
        return '<button type="button" class="btn" data-insert-warranty="' + escapeHtml(entry.brand) + '" style="margin:0 6px 6px 0;">' +
          '<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1V12M1 6.5H12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
          'Insert ' + escapeHtml(entry.brand) + ' terms</button>';
      }
      return '<span class="chip pending" style="margin:0 6px 6px 0;"><span class="chip-dot"></span>' + escapeHtml(m) + ' — no warranty on file</span>';
    }).join('');
    return '<div class="divider-label">Warranty terms on file</div>' +
      '<div style="margin-bottom:10px;">' + rows + '</div>';
  }

      if (entryModel && (mo.indexOf(entryModel) !== -1 || entryModel.indexOf(mo) !== -1)){

  /* -------- file attachments (actual documents, stored in full — all appendix sections) -------- */
  var MAX_FILE_BYTES = 8 * 1024 * 1024; // ~8MB raw file per attachment (chunked under the hood)
  var FILE_CHUNK_CHARS = 150000; // base64 chars per chunk — keeps each chunk doc safely under the 256KB db document cap
  function formatBytes(n){
    if (n < 1024) return n + ' B';
    if (n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
    return (n/(1024*1024)).toFixed(1) + ' MB';
  }
  function filesCollection(jobId){ return db.collection('jobs/' + jobId + '/files'); }

  /* Write a (possibly large) base64 payload as one metadata doc plus, if needed,
     a chunks subcollection — sequential awaits so we never blow the concurrent-write budget. */
  async function writeFileChunked(jobId, meta, base64){
    var ref = filesCollection(jobId).doc();
    if (base64.length <= FILE_CHUNK_CHARS){
      await ref.set(Object.assign({}, meta, { data: base64, chunkCount: 0 }));
      return ref.id;
    }
    var chunkCount = Math.ceil(base64.length / FILE_CHUNK_CHARS);
    await ref.set(Object.assign({}, meta, { chunkCount: chunkCount }));
    for (var i = 0; i < chunkCount; i++){
      var part = base64.slice(i * FILE_CHUNK_CHARS, (i + 1) * FILE_CHUNK_CHARS);
      await ref.collection('chunks').doc(String(i)).set({ data: part });
    }
    return ref.id;
  }

  /* Reassemble a file's full base64 payload, fetching chunks in order if it was split. */
  async function readFileChunked(jobId, fileId, metaData){
    if (!metaData.chunkCount){ return metaData.data || ''; }
    var ref = filesCollection(jobId).doc(fileId);
    var parts = new Array(metaData.chunkCount);
    for (var i = 0; i < metaData.chunkCount; i++){
      var snap = await ref.collection('chunks').doc(String(i)).get();
      parts[i] = (snap.exists && snap.data().data) || '';
    }
    return parts.join('');
  }

  async function deleteFileChunked(jobId, fileId, chunkCount){
    var ref = filesCollection(jobId).doc(fileId);
    if (chunkCount){
      for (var i = 0; i < chunkCount; i++){
        await ref.collection('chunks').doc(String(i)).delete();
      }
    }
    await ref.delete();
  }

  // Short "2 days ago" / "just now" label for a job list row, so a finished manual
  // reads as something already done rather than something to redo.
  function timeAgo(iso){
    if (!iso) return '';
    var then = new Date(iso).getTime();
    if (isNaN(then)) return '';
    var diff = Math.max(0, Date.now() - then);
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    var months = Math.floor(days / 30);
    if (months < 12) return months + 'mo ago';
    return Math.floor(months / 12) + 'y ago';
  }

  /* Strip invisible/zero-width unicode characters (zero-width space/non-joiner/joiner, BOM,
     bidi control marks) that sometimes ride along in pasted text — jsPDF's built-in fonts
     can't map them and end up mis-measuring the whole string, producing spaced-out, "broken
     font" looking text. Applied to every value before it reaches the PDF or the preview. */
  function cleanText(s){
    return String(s==null?'':s).replace(/[​-‏‪-‮⁠﻿]/g, '');
  }
  function sanitizeDeep(value){
    if (typeof value === 'string') return cleanText(value);
    if (Array.isArray(value)) return value.map(sanitizeDeep);
    if (value && typeof value === 'object'){
      var out = {};
      Object.keys(value).forEach(function(k){ out[k] = sanitizeDeep(value[k]); });
      return out;
    }
    return value;
  }

  /* Load a PDF into a pdf.js document proxy. Kept separate from extractPdfLines so the
     same open doc can be reused afterwards to render a page as an image (for the
     Claude image-scan fallback below) without re-reading the file. */
  async function loadPdfDoc(arrayBuffer){
    if (!window.pdfjsLib) throw new Error('PDF reading is unavailable right now');
    return await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  }

  /* Extract text from every page of a PDF, grouped into lines (by y-position) with each
     line's items kept in reading order and tagged with their x-position — good enough to
     reconstruct simple table rows without needing a real table-parsing library. */
  async function extractPdfLines(doc){
    var lines = [];
    for (var p = 1; p <= doc.numPages; p++){
      var page = await doc.getPage(p);
      var content = await page.getTextContent();
      var byY = {};
      content.items.forEach(function(item){
        if (!item.str || !item.str.trim()) return;
        var y = Math.round(item.transform[5] / 2) * 2; // 2pt tolerance bucket
        var x = item.transform[4];
        if (!byY[y]) byY[y] = [];
        byY[y].push({ str: item.str, x: x });
      });
      Object.keys(byY).forEach(function(y){
        var items = byY[y].sort(function(a,b){ return a.x - b.x; });
        lines.push({ page: p, items: items, text: items.map(function(i){ return i.str; }).join(' ') });
      });
    }
    return lines;
  }

  /* Some WSDs' equipment schedule page is a scanned/embedded picture of the table rather
     than real text — the surrounding title block and general notes are still ordinary
     text, so that page still shows up here, just with far fewer words than a page whose
     schedule really is typed text. Flag any page whose (sparse) text mentions "schedule"
     as a candidate for the Claude image-read fallback. */
  function findImageScheduleCandidatePages(lines){
    var byPage = {};
    lines.forEach(function(l){ (byPage[l.page] = byPage[l.page] || []).push(l.text); });
    var pages = [];
    Object.keys(byPage).forEach(function(p){
      var text = byPage[p].join(' ');
      var wordCount = text.split(/\s+/).filter(Boolean).length;
      if (/schedule/i.test(text) && wordCount < 150) pages.push(Number(p));
    });
    return pages;
  }

  /* Render one PDF page to a PNG blob, for handing to Claude via the "sample" capability
     when the page's schedule table turned out to be a picture rather than text. */
  async function renderPdfPageToBlob(doc, pageNum, scale){
    var page = await doc.getPage(pageNum);
    var viewport = page.getViewport({ scale: scale || 2.2 });
    var canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    var ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    return await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
  }

  /* Free, in-browser OCR fallback (Tesseract.js) for a WSD page whose schedule table is a
     scanned/embedded picture rather than real text — used on GitHub Pages where Claude's
     own image-reading capability isn't available. Renders the page at a higher resolution
     than the Claude image path (OCR does better with more pixels), runs Tesseract, then
     reshapes its word/line output into the same {page, items:[{str,x}], text} shape that
     extractPdfLines() produces so it can be fed straight into parseEquipmentCandidates() —
     same column-guessing heuristics, same "review before adding" behaviour either way.
     Accuracy depends on scan quality — always shown as editable candidates, never auto-added. */
  async function ocrPdfPageToLines(doc, pageNum, onProgress){
    if (!window.Tesseract) throw new Error('OCR reader did not load — check your connection and try again');
    var blob = await renderPdfPageToBlob(doc, pageNum, 3.5);
    var result = await window.Tesseract.recognize(blob, 'eng', {
      logger: function(m){
        if (onProgress && m && m.status === 'recognizing text' && typeof m.progress === 'number'){
          onProgress(Math.round(m.progress * 100));
        }
      }
    });
    var lines = (result && result.data && result.data.lines) || [];
    return lines.map(function(line){
      var items = (line.words || []).map(function(w){ return { str: w.text, x: w.bbox ? w.bbox.x0 : 0 }; });
      return { page: pageNum, items: items, text: line.text || items.map(function(i){ return i.str; }).join(' ') };
    });
  }

  var WSD_IMAGE_SCAN_PROMPT = '' +
    'This image is one page from a mechanical services work order/drawing set (a WSD). ' +
    'It shows an equipment schedule table — this may include an AC Unit Schedule, a Fan Schedule, and/or a Grille Schedule. ' +
    'Read every equipment item in the schedule and reply with ONLY a JSON array (no other text), one object per item, shaped like:\n' +
    '{"ref":"AC-01","type":"AC","manufacturer":"Daikin","model":"FCA100CVMA"}\n' +
    'Rules:\n' +
    '- "type" must be exactly "AC" for air conditioning units, "Fan" for exhaust/supply/inline/roof-mounted fans, or "Other" for anything else (e.g. a grille).\n' +
    '- When an AC unit is listed with a separate indoor and outdoor unit, use the INDOOR unit\'s reference (e.g. "AC-01", not "CU-01") for "ref", and the INDOOR unit\'s model number for "model".\n' +
    '- Include every fan row shown (e.g. EF-, SF-, RC- references), each with its own model number.\n' +
    '- Skip grille-only rows unless a distinct manufacturer and model number is shown for that row.\n' +
    '- If a field is not shown on the schedule, use an empty string for it — never invent a value.\n' +
    'Reply with the JSON array only.';

  /* Friendly copy for a failed sample() image-scan call — branch on e.code, never e.message. */
  function imageScanErrorMessage(err){
    var code = err && err.code;
    if (code === 'not_granted') return 'You declined letting Claude read this file.';
    if (code === 'images_unavailable' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') return 'Claude reading isn\'t available in this view right now.';
    if (code === 'rate_limited') return 'Too many requests right now — try again shortly.';
    if (code === 'image_rejected') return 'Could not read that page image — try a different page.';
    if (code === 'invalid_json') return 'Claude\'s answer wasn\'t in the expected format — try again.';
    if (code === 'refused') return 'Claude declined to read that page.';
    return 'Could not read the schedule' + (err && err.message ? (' — ' + err.message) : '') + '.';
  }

  function dedupeCandidates(list){
    var seen = {};
    return list.filter(function(c){
      var key = (c.ref+'|'+c.manufacturer+'|'+c.model).toLowerCase();
      if (seen[key]) return false;
      seen[key] = true;
      return true;
    });
  }

  /* Look at a section's header line (and the line right after it, in case OCR split the
     header from the manufacturer name into two lines) for one of KNOWN_MANUFACTURERS —
     Victorian Projects' WSD schedules put the manufacturer top-right of the table title
     (e.g. "AC UNIT SCHEDULE ... DAIKIN", "FAN SCHEDULE ... FANTECH"), not per row. */
  function extractSectionManufacturer(lines, headerIdx){
    var probe = [lines[headerIdx], lines[headerIdx + 1]].filter(Boolean);
    for (var i = 0; i < probe.length; i++){
      var lower = probe[i].text.toLowerCase();
      var brand = KNOWN_MANUFACTURERS.find(function(m){ return lower.indexOf(m.toLowerCase()) !== -1; });
      if (brand) return brand;
    }
    return '';
  }

  /* Find a "label: value" row within a section by matching labelRe against the row's text,
     then mapping how many characters the label consumed back onto that row's items — the
     items after that point are the value(s). If the label turns out to be the WHOLE line
     (common when a table cell's border makes OCR/pdf.js treat the label and its value as
     separate lines), fall back to the very next line's items instead. Pass singleValue:true
     for a label known to hold exactly one token (WSD reference / model numbers never
     contain spaces) — that also protects against accidentally picking up a neighbouring
     table's text that happens to share the same row of the page (e.g. the AC Unit Schedule
     and Grille Schedule sitting side by side at the same height). */
  function findLabelRow(sectionLines, labelRe, opts){
    for (var i = 0; i < sectionLines.length; i++){
      var line = sectionLines[i];
      var m = labelRe.exec(line.text);
      if (!m) continue;
      var consumed = m.index + m[0].length;
      var pos = 0, cut = line.items.length;
      for (var j = 0; j < line.items.length; j++){
        pos += line.items[j].str.length + 1;
        if (pos >= consumed){ cut = j + 1; break; }
      }
      var rest = line.items.slice(cut);
      if (!rest.length && sectionLines[i + 1]) rest = sectionLines[i + 1].items.slice(0);
      if (opts && opts.singleValue) rest = rest.slice(0, 1);
      return { line: line, valueItems: rest };
    }
    return null;
  }

  /* Match a multi-column row's items (e.g. a "MODEL" row under a Fan Schedule) to fixed
     column x-positions established by an earlier row (e.g. that table's "UNIT NO." row),
     by nearest x-position — tolerant of the odd pixel of OCR jitter between rows. */
  function assignToColumns(items, anchors){
    var out = anchors.map(function(){ return ''; });
    items.forEach(function(item){
      var bestIdx = -1, bestDist = Infinity;
      anchors.forEach(function(ax, idx){
        var d = Math.abs(item.x - ax);
        if (d < bestDist){ bestDist = d; bestIdx = idx; }
      });
      if (bestIdx !== -1) out[bestIdx] = (out[bestIdx] ? out[bestIdx] + ' ' : '') + item.str;
    });
    return out.map(function(s){ return s.trim(); });
  }

  /* Structured pass: recognise Victorian Projects' standard WSD table shapes directly,
     rather than guessing from a flat "manufacturer somewhere on this line" search —
     - AC Unit Schedule: one indoor/outdoor unit per table block, label rows down the left,
       a single value in each (per the same indoor-unit convention used for the Claude
       image-read prompt above: use the INDOOR unit's reference and model).
     - Fan Schedule: several fans as columns across one table, with a "UNIT NO." row fixing
       each column's position and a "MODEL" row supplying each column's model number.
     Grille Schedule is deliberately not parsed here — it has no manufacturer's model
     number per item, just dimensions, so there's nothing reliable to add automatically. */
  function parseStructuredSchedule(lines){
    var headers = [];
    lines.forEach(function(l, i){
      if (/\bAC\s*UNIT\s*SCHEDULE\b/i.test(l.text)) headers.push({ i: i, kind: 'ac' });
      else if (/\bFAN\s*SCHEDULE\b/i.test(l.text)) headers.push({ i: i, kind: 'fan' });
    });
    var candidates = [];
    headers.forEach(function(h, hi){
      var endIdx = (hi + 1 < headers.length) ? headers[hi + 1].i : lines.length;
      var sectionLines = lines.slice(h.i, endIdx);
      var manufacturer = extractSectionManufacturer(lines, h.i);
      var page = sectionLines[0] ? sectionLines[0].page : undefined;

      if (h.kind === 'ac'){
        var refRow = findLabelRow(sectionLines, /INDOOR\s*UNIT\s*REFERENCE/i, { singleValue: true })
          || findLabelRow(sectionLines, /\bUNIT\s*REFERENCE\b/i, { singleValue: true });
        var modelRow = findLabelRow(sectionLines, /MODEL\s*INDOOR\s*UNIT/i, { singleValue: true })
          || findLabelRow(sectionLines, /\bMODEL\b/i, { singleValue: true });
        var ref = refRow ? refRow.valueItems.map(function(i){ return i.str; }).join(' ').trim() : '';
        var model = modelRow ? modelRow.valueItems.map(function(i){ return i.str; }).join(' ').trim() : '';
        if (ref || model){
          candidates.push({ id: uid(), ref: ref, type: 'AC', manufacturer: manufacturer, model: model, page: page, include: true });
        }
      } else if (h.kind === 'fan'){
        var unitRow = findLabelRow(sectionLines, /UNIT\s*NO\.?/i);
        if (unitRow && unitRow.valueItems.length){
          var anchors = unitRow.valueItems.map(function(i){ return i.x; });
          var refs = unitRow.valueItems.map(function(i){ return i.str; });
          var modelRow2 = findLabelRow(sectionLines, /^MODEL\b/i);
          var models = modelRow2 ? assignToColumns(modelRow2.valueItems, anchors) : [];
          refs.forEach(function(ref, idx){
            var model2 = models[idx] || '';
            if (!ref && !model2) return;
            candidates.push({ id: uid(), ref: ref, type: 'Fan', manufacturer: manufacturer, model: model2, page: page, include: true });
          });
        }
      }
    });
    return dedupeCandidates(candidates);
  }

  /* Best-effort fallback for WSDs that don't follow the structured layout above: for any
     line mentioning a known manufacturer, split the line's items into "before / manufacturer /
     after" and offer that as a candidate Reference / Manufacturer / Model row. Weaker than
     the structured pass (this is the original approach, kept for schedules formatted as one
     flat row per item rather than Victorian Projects' label-rows-per-unit table). */
  function parseFlatRowCandidates(lines){
    var candidates = [];
    lines.forEach(function(line){
      var lower = line.text.toLowerCase();
      var brand = KNOWN_MANUFACTURERS.find(function(m){ return lower.indexOf(m.toLowerCase()) !== -1; });
      if (!brand) return;
      var items = line.items;
      var brandIdx = items.findIndex(function(i){ return i.str.toLowerCase().indexOf(brand.toLowerCase()) !== -1; });
      if (brandIdx === -1) return;
      var before = items.slice(0, brandIdx).map(function(i){ return i.str; }).join(' ').trim();
      var after = items.slice(brandIdx + 1).map(function(i){ return i.str; }).join(' ').trim();
      // The "Reference" is usually the shortest leading token (e.g. AC-1.1, FAN-03);
      // the "Model" is usually the first alphanumeric-looking token after the brand.
      var refGuess = (before.match(/[A-Za-z]{1,6}[-.]?\d+[A-Za-z0-9.\-]*/) || [before])[0];
      var modelGuess = (after.match(/[A-Za-z0-9][A-Za-z0-9\-\/]{2,}/) || [after])[0] || '';
      candidates.push({
        id: uid(),
        ref: (refGuess || '').trim(),
        manufacturer: brand,
        model: (modelGuess || '').trim(),
        page: line.page,
        include: true
      });
    });
    return dedupeCandidates(candidates);
  }

  function parseEquipmentCandidates(lines){
    var structured = parseStructuredSchedule(lines);
    if (structured.length) return structured;
    return parseFlatRowCandidates(lines);
  }

  }

        '<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1V12M1 6.5H12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        'Add row' +
      '</button> ' +
      (window.pdfjsLib ? (
        '<label class="eq-add-row" style="margin-left:8px;">' +
          '<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 1.5H8L11 4.5V11.5C11 11.9 10.7 12.2 10.3 12.2H2.7C2.3 12.2 2 11.9 2 11.5V2.2C2 1.8 2.3 1.5 2.7 1.5Z" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 6.5H8.5M4.5 9H8.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>' +
          'Scan WSD for equipment' +
          '<input type="file" accept="application/pdf" data-wsd-scan style="display:none;" />' +
        '</label>'
      ) : '') +
      '<div class="field-note" style="margin-top:8px;">Scans a WSD PDF\'s text-based equipment schedule table and suggests rows to add — always shown for review before anything is added, since table layouts vary job to job.</div>' +
      wsdScanCandidatesHtml() +
      '<div class="divider-label">WSD reference</div>' +
      '<div class="field-grid span-1">' +
        field('Notes / WSD file or link', 'wsdNotes', job.wsdNotes, 'textarea', 'e.g. WSD schedule received 3/9 — see shared drive /Jobs/24-118/WSD-schedule.pdf') +
      '</div>'
    );

    // Appendix sections
    APPENDICES.forEach(function(a, idx){
      var s = job.sections[a.key];
      var extra = '';
      if (a.key === 'warranty') extra = warrantyLibraryPanel(job);
      else if (a.key === 'technicalData') extra = technicalDataLibraryPanel(job);
      var uploadExtra = db ? filesPanel(state.activeId, a.key) : uploadUnavailablePanel();
      var linksExtra = db ? linksPanel(job, a.key) : '';
      html += sectionShell(a.key, String(3+idx), a.label, a.sub, '' +
        '<div class="status-row">' + statusButtons(a.key, s.status) + '</div>' +
        extra +
        linksExtra +
        uploadExtra +
        '<div class="field-grid span-1">' +
          field('Notes / file name or link', 'sections.' + a.key + '.notes', s.notes, 'textarea', 'Where to find it, or what\'s still needed') +
        '</div>'
      );
    });

    inner.innerHTML = html;
    wireJobDetailEvents(job);
  }

  function sectionShell(key, num, title, sub, bodyHtml){
    var open = state.openSections[key];
    return '' +
      '<div class="section' + (open?' open':'') + '" data-section-key="' + key + '">' +
        '<div class="section-head" data-toggle="' + key + '">' +
          '<div class="section-num">' + num + '</div>' +
          '<div class="section-titles">' +
            '<div class="section-title">' + title + '</div>' +
            '<div class="section-sub">' + sub + '</div>' +
          '</div>' +
          '<svg class="section-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</div>' +
        '<div class="section-body">' + bodyHtml + '</div>' +
      '</div>';
  }

  function field(label, path, value, kind, placeholder){
    var id = 'f_' + path.replace(/\./g,'_');
    var full = kind === 'textarea' ? ' full' : '';
    var input = kind === 'textarea'
      ? '<textarea id="' + id + '" data-path="' + path + '" placeholder="' + escapeHtml(placeholder||'') + '">' + escapeHtml(value) + '</textarea>'
      : '<input id="' + id + '" data-path="' + path + '" type="text" value="' + escapeHtml(value) + '" placeholder="' + escapeHtml(placeholder||'') + '" />';
    return '<div class="field' + full + '"><label for="' + id + '">' + label + '</label>' + input + '</div>';
  }

  function readonlyField(label, value){
    return '<div class="field"><label>' + label + '</label><input type="text" value="' + escapeHtml(value) + '" disabled style="color:var(--ink-faint);background:var(--surface-2);white-space:pre-line;" /></div>';
  }

  /* ---------------- events on job detail ---------------- */
  function setPath(obj, path, value){
    var parts = path.split('.');
    var cur = obj;
    for (var i=0;i<parts.length-1;i++){
      cur = cur[parts[i]];
    }
    cur[parts[parts.length-1]] = value;
  }

  function wireJobDetailEvents(job){
    // section toggles
    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-toggle');
        state.openSections[key] = !state.openSections[key];
        var sectionEl = document.querySelector('[data-section-key="' + key + '"]');
        sectionEl.classList.toggle('open');
      });
    });

    // text fields bound by data-path
    document.querySelectorAll('[data-path]').forEach(function(el){
      el.addEventListener('input', function(){
        var path = el.getAttribute('data-path');
        var value = cleanText(el.value);
        setPath(job, path, value);
        job.updatedAt = nowIso();
        queueFieldChange(state.activeId, path, value);
        scheduleSave(state.activeId);
        renderJobListSoon();
      });
    });

    // equipment row fields
    document.querySelectorAll('#eqTbody .eq-field').forEach(function(el){
      el.addEventListener('input', function(){
        var tr = el.closest('tr');
        var rowId = tr.getAttribute('data-row');
        var field = el.getAttribute('data-field');
        var row = job.equipment.find(function(r){ return r.id === rowId; });
        if (row){
          row[field] = el.value;
          job.updatedAt = nowIso();
          queueFieldChange(state.activeId, 'equipment', job.equipment);
          scheduleSave(state.activeId);
        }
      });
    });

    // remove equipment row
    document.querySelectorAll('.eq-row-del').forEach(function(el){
      el.addEventListener('click', function(){
        var rowId = el.getAttribute('data-del');
        job.equipment = job.equipment.filter(function(r){ return r.id !== rowId; });
        job.updatedAt = nowIso();
        queueFieldChange(state.activeId, 'equipment', job.equipment);
        scheduleSave(state.activeId);
        renderJobDetail();
        renderJobList();
      });
    });

    // add equipment row
    var addBtn = document.getElementById('eqAddRow');
    if (addBtn){
      addBtn.addEventListener('click', function(){
        job.equipment.push({ id: uid(), ref:'', type:'AC', manufacturer:'', model:'' });
        job.updatedAt = nowIso();
        queueFieldChange(state.activeId, 'equipment', job.equipment);
        scheduleSave(state.activeId);
        renderJobDetail();
        renderJobList();
      });
    }

    // scan a WSD PDF for equipment schedule rows
    var wsdScanInput = document.querySelector('[data-wsd-scan]');
    if (wsdScanInput){
      wsdScanInput.addEventListener('change', function(){
        var file = wsdScanInput.files && wsdScanInput.files[0];
        wsdScanInput.value = '';
        if (!file) return;
        state.wsdScan = { sourceName: file.name, status: 'scanning', candidates: [] };
        renderJobDetail();
        var reader = new FileReader();
        reader.onload = function(){
          loadPdfDoc(reader.result).then(function(doc){
            return extractPdfLines(doc).then(function(lines){
              var candidates = parseEquipmentCandidates(lines);
              // Only worth flagging image-based pages when the text-based pass found nothing —
              // if it already found real rows, there's nothing to fall back for.
              var imagePages = candidates.length ? [] : findImageScheduleCandidatePages(lines);
              state.wsdScan = { sourceName: file.name, status: 'done', candidates: candidates, doc: doc, imageFallbackPages: imagePages, imageScanning: null };
              renderJobDetail();
            });
          }).catch(function(err){
            state.wsdScan = { sourceName: file.name, status: 'error', candidates: [], error: err && err.message };
            renderJobDetail();
          });
        };
        reader.onerror = function(){
          state.wsdScan = { sourceName: file.name, status: 'error', candidates: [], error: 'could not read file' };
          renderJobDetail();
        };
        reader.readAsArrayBuffer(file);
      });
    }

    // toggle / edit a scanned WSD candidate row
    document.querySelectorAll('[data-cand-include]').forEach(function(el){
      el.addEventListener('change', function(){
        if (!state.wsdScan) return;
        var id = el.getAttribute('data-cand-include');
        var c = state.wsdScan.candidates.find(function(x){ return x.id === id; });
        if (c) c.include = el.checked;
      });
    });
    document.querySelectorAll('[data-cand-field]').forEach(function(el){
      el.addEventListener('input', function(){
        if (!state.wsdScan) return;
        var tr = el.closest('[data-cand]');
        var id = tr && tr.getAttribute('data-cand');
        var c = state.wsdScan.candidates.find(function(x){ return x.id === id; });
        if (c) c[el.getAttribute('data-cand-field')] = el.value;
      });
    });

    // read a scanned schedule PAGE IMAGE with Claude (fallback for WSDs whose schedule
    // table is a scanned/embedded picture rather than real text)
    document.querySelectorAll('[data-wsd-image-scan]').forEach(function(el){
      el.addEventListener('click', function(){
        var pageNum = Number(el.getAttribute('data-wsd-image-scan'));
        var scan = state.wsdScan;
        if (!scan || !scan.doc) return;
        if (!sampleCap){ toast('Claude isn\'t available in this view right now'); return; }
        scan.imageScanning = pageNum;
        renderJobDetail();
        renderPdfPageToBlob(scan.doc, pageNum).then(function(blob){
          toast('Asking Claude to read page ' + pageNum + '…');
          return sampleCap.json(WSD_IMAGE_SCAN_PROMPT, { images: blob, modelTier: 'default' });
        }).then(function(rows){
          var list = Array.isArray(rows) ? rows : [];
          var added = list.map(function(r){
            var type = r && ['AC','Fan','Other'].indexOf(r.type) !== -1 ? r.type : '';
            return {
              id: uid(),
              ref: cleanText((r && r.ref) || ''),
              type: type,
              manufacturer: cleanText((r && r.manufacturer) || ''),
              model: cleanText((r && r.model) || ''),
              page: pageNum,
              include: true
            };
          }).filter(function(c){ return c.ref || c.manufacturer || c.model; });
          scan.imageScanning = null;
          scan.candidates = (scan.candidates || []).concat(added);
          renderJobDetail();
          toast(added.length
            ? ('Claude found ' + added.length + ' row' + (added.length===1?'':'s') + ' on page ' + pageNum + ' — review before adding.')
            : ('Claude could not find any equipment rows on page ' + pageNum + '.'));
        }).catch(function(err){
          scan.imageScanning = null;
          renderJobDetail();
          toast(imageScanErrorMessage(err));
        });
      });
    });

    // read a scanned schedule PAGE IMAGE with free in-browser OCR (Tesseract.js) — the
    // GitHub Pages fallback for WSDs whose schedule table is a scanned/embedded picture,
    // used when Claude's own image-reading capability (sampleCap) isn't available here
    document.querySelectorAll('[data-wsd-ocr-scan]').forEach(function(el){
      el.addEventListener('click', function(){
        var pageNum = Number(el.getAttribute('data-wsd-ocr-scan'));
        var scan = state.wsdScan;
        if (!scan || !scan.doc) return;
        if (!window.Tesseract){ toast('OCR reader isn\'t available right now'); return; }
        scan.imageScanning = pageNum;
        scan.ocrProgress = 0;
        renderJobDetail();
        toast('Reading page ' + pageNum + ' with OCR — this can take up to a minute…');
        ocrPdfPageToLines(scan.doc, pageNum, function(pct){
          if (state.wsdScan) { state.wsdScan.ocrProgress = pct; renderJobDetail(); }
        }).then(function(lines){
          var found = parseEquipmentCandidates(lines).map(function(c){
            c.page = pageNum;
            c.viaOcr = true;
            return c;
          });
          scan.imageScanning = null;
          scan.ocrProgress = null;
          scan.candidates = (scan.candidates || []).concat(found);
          renderJobDetail();
          toast(found.length
            ? ('OCR found ' + found.length + ' row' + (found.length===1?'':'s') + ' on page ' + pageNum + ' — check each one carefully against the drawing before adding.')
            : ('OCR could not confidently match any equipment rows on page ' + pageNum + ' — try "+ Add row" to enter them manually.'));
        }).catch(function(err){
          scan.imageScanning = null;
          scan.ocrProgress = null;
          renderJobDetail();
          toast('Could not read that page with OCR' + (err && err.message ? (' — ' + err.message) : '') + '.');
        });
      });
    });

    // add checked WSD candidates to the equipment schedule
    var wsdCandAdd = document.getElementById('wsdCandAdd');
    if (wsdCandAdd){
      wsdCandAdd.addEventListener('click', function(){
        var scan = state.wsdScan;
        if (!scan) return;
        var added = 0;
        scan.candidates.forEach(function(c){
          if (!c.include) return;
          var typeGuess = (c.type && ['AC','Fan','Other'].indexOf(c.type) !== -1)
            ? c.type
            : (/fan|fantech/i.test(c.manufacturer) ? 'Fan' : 'AC');
          job.equipment.push({ id: uid(), ref: c.ref, type: typeGuess, manufacturer: c.manufacturer, model: c.model });
          added++;

        if (!added){ toast('No rows checked'); return; }
        job.updatedAt = nowIso();
        queueFieldChange(state.activeId, 'equipment', job.equipment);
        scheduleSave(state.activeId);
        state.wsdScan = null;
        renderJobDetail();
        renderJobList();
        toast('Added ' + added + ' row' + (added===1?'':'s') + ' from the WSD scan — double-check them against the drawing.');

    var wsdCandDiscard = document.getElementById('wsdCandDiscard');

    // insert warranty terms
    document.querySelectorAll('[data-insert-warranty]').forEach(function(el){
      el.addEventListener('click', function(){

          toast('Too large (' + formatBytes(file.size) + ') — max ~' + formatBytes(MAX_FILE_BYTES) + '. Use the notes field for bigger files.');
          return;
        }
        var jobId = state.activeId;
        var reader = new FileReader();
        reader.onload = function(){
          var result = reader.result; // data:mime;base64,XXXX
          var comma = result.indexOf(',');
          var base64 = comma !== -1 ? result.slice(comma+1) : result;
          toast('Uploading ' + file.name + '…');
          writeFileChunked(jobId, {
            filename: file.name,

            section: sectionKey,
            uploadedAt: nowIso()

    // download attached file

      el.addEventListener('click', function(){

        Object.keys(all).forEach(function(sec){ (all[sec]||[]).forEach(function(f){ if (f.id === fileId) found = f; }); });
        if (!found) return;
        (async function(){
          try{
            if (found.chunkCount) toast('Fetching ' + found.filename + '…');

            var binary = atob(base64);

        job.sections[key].links = job.sections[key].links || [];

        renderJobList();
        toast('Link added');

    // remove linked file

      el.addEventListener('click', function(){

          var after = before.filter(function(l){ return l.id !== linkId; });
          if (after.length !== before.length){

    document.querySelectorAll('.status-btn').forEach(function(el){
      el.addEventListener('click', function(){

        queueFieldChange(state.activeId, 'sections.' + key + '.status', status);
        scheduleSave(state.activeId);
        renderJobDetail();
        renderJobList();
        // keep this section open after re-render
        state.openSections[key] = true;

      queueFieldChange(state.activeId, 'name', job.name);
      scheduleSave(state.activeId);
      renderJobListSoon();
      // duplicate-name warning banner depends on the name typed, so re-check on blur
      // rather than every keystroke (avoids re-render fighting the caret mid-typing)
    });
    nameInput.addEventListener('blur', function(){ renderJobDetail(); });

    var openDupBtn = document.querySelector('[data-open-dup]');
    if (openDupBtn){
      openDupBtn.addEventListener('click', function(){

      });
    }
  }

  var jobListRenderTimer = null;
  function renderJobListSoon(){
    clearTimeout(jobListRenderTimer);
    jobListRenderTimer = setTimeout(renderJobList, 150);
  }

  /* ---------------- persistence ---------------- */
  // Record that a specific field on job `id` changed, so the next autosave writes ONLY
  // that field (a Firestore-style dot-path update) instead of the whole job document.
  // This is what stops one person's edit to (say) the equipment schedule from silently
  // wiping out someone else's just-saved edit to a different field on the same job —
  // the old code always did a full-document `.set(job)` from this tab's in-memory copy,
  // which is stale the moment anyone else saves anything on that job.
  function queueFieldChange(id, path, value){
    pendingChanges[id] = pendingChanges[id] || {};
    pendingChanges[id][path] = value;
  }

  function scheduleSave(id){
    clearTimeout(saveTimers[id]);
    saveTimers[id] = setTimeout(function(){
      delete saveTimers[id];
      autoSaveJob(id);
    }, 500);
  }

  // Debounced autosave: writes only the fields queued by queueFieldChange since the
  // last save (a targeted `.update()`), falling back to a full `.set()` only if nothing
  // was queued (shouldn't normally happen, but keeps old call sites safe).
  function autoSaveJob(id){
    var job = state.jobs[id];
    if (!job) { pendingChanges[id] = null; return Promise.resolve(); }
    if (db){
      var changes = pendingChanges[id];
      pendingChanges[id] = null;
      // Mark this job's write as in flight for the whole round trip, not just while it sits
      // in pendingChanges — see the comment on saveInFlight above for why that gap matters.
      saveInFlight[id] = true;
      var clearFlight = function(){ delete saveInFlight[id]; };
      if (changes && Object.keys(changes).length){
        changes.updatedAt = job.updatedAt;
        return db.collection('jobs').doc(id).update(changes).then(clearFlight, function(err){
          clearFlight();
          toast('Could not save — ' + (err && err.message ? err.message : 'try again'));
          throw err;
        });
      }
      return db.collection('jobs').doc(id).set(job).then(clearFlight, function(err){
        clearFlight();
        toast('Could not save — ' + (err && err.message ? err.message : 'try again'));
        throw err;
      });
    }
    persistLocal();
    return Promise.resolve();
  }

  // The manual "Save" button and job creation still write the FULL document — that's
  // fine, since it's this tab's deliberate, explicit save of everything it currently
  // shows, not a debounced side-effect of one small edit.
  function saveJob(id){
    var job = state.jobs[id];
    if (!job) return Promise.resolve();
    if (db){
      return db.collection('jobs').doc(id).set(job).catch(function(err){
        toast('Could not save — ' + (err && err.message ? err.message : 'try again'));
        throw err;
      });
    }
    persistLocal();
    return Promise.resolve();
  }

  // Everything already autosaves ~500ms after each edit — this button is for the
  // reassurance of an explicit, immediate save: skip the debounce and confirm.
  function saveNow(id){
    clearTimeout(saveTimers[id]);
    delete saveTimers[id];
    pendingChanges[id] = null; // the full save below covers whatever was pending
    saveInFlight[id] = true; // same in-flight gap as autoSaveJob — see comment on saveInFlight above
    var btn = document.getElementById('saveBtn');
    if (btn) btn.disabled = true;
    return saveJob(id).then(function(){
      toast('Saved');
    }).catch(function(){ /* saveJob already toasted the failure */ }).then(function(){
      delete saveInFlight[id];
      if (btn) btn.disabled = false;
    });
  }

  var LOCAL_KEY = 'vp-oam-jobs-v1';
  function persistLocal(){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify({ jobs: state.jobs, order: state.order }));
    }catch(e){ /* ignore */ }
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        state.jobs = parsed.jobs || {};
        state.order = parsed.order || [];
      }
    }catch(e){ /* ignore */ }
  }

  /* ---------------- job list actions ---------------- */
  function selectJob(id){
    state.activeId = id;
    state.wsdScan = null;
    renderJobList();
    renderJobDetail();
    if (typeof closeSidebar === 'function') closeSidebar();
    refreshFiles(id);
  }

  function refreshFiles(jobId){
    if (!db || !jobId) return;
    var bySection = {};
    APPENDICES.forEach(function(a){ bySection[a.key] = []; });
    filesCollection(jobId).get().then(function(snap){
      snap.docs.forEach(function(d){
        var data = d.data();
        if (!data) return;
        // note: `data.data` is only present for small (unchunked) files here — full bytes
        // are fetched on demand via readFileChunked() when downloading or exporting.
        var entry = { id: d.id, filename: data.filename, mime: data.mime, size: data.size, data: data.data, chunkCount: data.chunkCount || 0, section: data.section, uploadedAt: data.uploadedAt };
        if (bySection[entry.section]) bySection[entry.section].push(entry);
      });
      state.filesByJob[jobId] = bySection;
      if (state.activeId === jobId) renderJobDetail();
    }).catch(function(){ /* leave whatever was cached */ });
  }

  function createJob(){
    var id = uid();
    var job = blankJob('');
    state.jobs[id] = job;
    state.order.unshift(id);
    state.activeId = id;
    state.wsdScan = null;
    if (db){
      db.collection('jobs').doc(id).set(job).catch(function(){ toast('Could not create job'); });
    } else {
      persistLocal();
    }
    renderJobList();
    renderJobDetail();
    setTimeout(function(){
      var el = document.getElementById('jobNameInput');
      if (el) el.focus();
    }, 30);
  }

  function confirmDeleteJob(){
    var job = state.jobs[state.activeId];
    if (!job) return;
    openModal(
      'Delete this job manual?',
      'This removes "' + (job.name || 'Untitled job') + '" and everything entered for it. This can\'t be undone.',
      function(){
        var id = state.activeId;
        delete state.jobs[id];
        state.order = state.order.filter(function(x){ return x !== id; });
        state.activeId = state.order.length ? state.order[0] : null;
        if (db){
          db.collection('jobs').doc(id).delete().catch(function(){});
        } else {
          persistLocal();
        }
        renderJobList();
        renderJobDetail();
      }
    );
  }

  function exportPdf(){
    var job = state.jobs[state.activeId];
    if (!job) return;
    job = sanitizeDeep(job);
    if (!window.jspdf){ toast('PDF library still loading — try again in a moment'); return; }

    var jobName = (job.name && job.name.trim()) ? job.name.trim() : 'Job Name';
    var doc = new window.jspdf.jsPDF({ unit:'pt', format:'a4' });
    doc.addFileToVFS('PublicSans-Regular.ttf', VP_FONT_PS_REG); doc.addFont('PublicSans-Regular.ttf','PublicSans','normal');
    doc.addFileToVFS('PublicSans-SemiBold.ttf', VP_FONT_PS_BOLD); doc.addFont('PublicSans-SemiBold.ttf','PublicSans','bold');
    doc.addFileToVFS('PublicSans-Italic.ttf', VP_FONT_PS_ITAL); doc.addFont('PublicSans-Italic.ttf','PublicSans','italic');
    doc.addFileToVFS('Newsreader-Medium.ttf', VP_FONT_NR_MED); doc.addFont('Newsreader-Medium.ttf','Newsreader','normal');
    var pageW = doc.internal.pageSize.getWidth();
    var margin = 48;
    var contentW = pageW - margin*2;
    var accent = [11,79,212];
    var navy = [10,26,77];
    var ink = [51,59,71];
    var softInk = [107,118,136];
    var charcoal = [20,24,30];
    var tocEntries = [];

    function footerHeader(pageJobName){
      var pageCount = doc.internal.getNumberOfPages();
      for (var i=1;i<=pageCount;i++){
        doc.setPage(i);
        if (i > 1){
          doc.setDrawColor(223,228,236);
          doc.setLineWidth(0.75);
          doc.line(margin, 56, pageW-margin, 56);
          doc.setFont('PublicSans','normal'); doc.setFontSize(8.5); doc.setTextColor(softInk[0],softInk[1],softInk[2]);
          doc.text('Operation and Maintenance Manual', margin, 40);
          doc.text('Project Name: ' + pageJobName, margin, 51);
          try{ doc.addImage(LOGO_DATAURL, 'PNG', pageW-margin-108, 14, 108, 28.2); }catch(e){}
        }
        doc.setFont('PublicSans','normal'); doc.setFontSize(8); doc.setTextColor(softInk[0],softInk[1],softInk[2]);
        doc.text('Victorian Projects — VP-OAM', margin, doc.internal.pageSize.getHeight()-28);
        doc.text('Page ' + i + ' of ' + pageCount, pageW-margin, doc.internal.pageSize.getHeight()-28, { align:'right' });
      }
    }

    function heading(text, y){
      tocEntries.push({ text: text, page: doc.internal.getNumberOfPages(), bold: true });
      doc.setFont('Newsreader','normal'); doc.setFontSize(16); doc.setTextColor(navy[0],navy[1],navy[2]);
      doc.text(text, margin, y);
      doc.setDrawColor(accent[0],accent[1],accent[2]); doc.setLineWidth(1.2);
      doc.line(margin, y+5, margin+26, y+5);
      return y + 22;
    }
    function subheading(text, y){
      tocEntries.push({ text: text, page: doc.internal.getNumberOfPages(), bold: false });
      doc.setFont('PublicSans','bold'); doc.setFontSize(10.5); doc.setTextColor(accent[0],accent[1],accent[2]);
      doc.text(text, margin, y);
      return y + 15;
    }
    function paragraphs(list, y, jobNameVal){
      doc.setFont('PublicSans','normal'); doc.setFontSize(9.5); doc.setTextColor(ink[0],ink[1],ink[2]);
      list.forEach(function(p){
        var txt = p.replace('{{JOB}}', jobNameVal);
        var lines = doc.splitTextToSize(txt, contentW);
        lines.forEach(function(line){
          if (y > 760){ doc.addPage(); y = 70; }
          doc.text(line, margin, y);
          y += 13;
        });
        y += 5;
      });
      return y;
    }
    function ensureSpace(y, needed){
      if (y + needed > 760){ doc.addPage(); return 70; }
      return y;
    }
    function hazardTable(title, rows, y){
      y = ensureSpace(y, 40);
      doc.setFont('PublicSans','bold'); doc.setFontSize(9.5); doc.setTextColor(ink[0],ink[1],ink[2]);
      doc.text(title, margin, y);
      y += 10;
      doc.autoTable({
        startY: y,
        margin: { left: margin, right: margin },
        head: [['Activity','Hazard']],
        body: rows,
        styles: { font:'PublicSans', fontSize:9, cellPadding:6, textColor: ink, lineColor:[223,228,236], lineWidth:0.5 },
        headStyles: { fillColor: navy, textColor:255, fontStyle:'bold' },
        columnStyles: { 0: { cellWidth: contentW*0.32 } },
        theme: 'grid', alternateRowStyles: { fillColor: [247,248,250] }
      });

    doc.setFont('PublicSans','normal'); doc.setFontSize(9); doc.setTextColor(softInk[0],softInk[1],softInk[2]);
    doc.text('2/9 Industry Boulevard, Carrum Downs VIC 3201 \u00b7 (03) 9798-7780', margin, 752);
    doc.text('admin@victorianprojects.com.au \u00b7 victorianprojects.com.au', margin, 766);

    // ---- Page 2: Contents (placeholder — filled in once every page number is known) ----

    // ---- Page 3: Contact information ----
    doc.addPage();
