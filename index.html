    y = paragraphs(STATIC_TEXT.faultConditions, y, jobName);
    y = ensureSpace(y, 60);
    y = subheading('6.2 Emergency Procedures', y);
    y = paragraphs(STATIC_TEXT.emergency, y, jobName);

    // ---- Appendix pages ----
    function isEmbeddableFile(f){
      var mime = (f.mime||'').toLowerCase();
      var name = (f.filename||'').toLowerCase();
      if (mime === 'application/pdf' || /\.pdf$/.test(name)) return 'pdf';
      if (/^image\/(png)$/.test(mime) || /\.png$/.test(name)) return 'png';
      if (/^image\/(jpe?g)$/.test(mime) || /\.jpe?g$/.test(name)) return 'jpg';
      return null;
    }
    var embedPlan = []; // { anchorPage, label, files: [{...file, kind}] }
    APPENDICES.forEach(function(a, idx){
      doc.addPage();
      y = 90;
      y = heading('Appendix ' + (idx+1) + '. ' + a.label.split('—')[1].trim(), y);
      var s = job.sections[a.key];
      // Status label and "no notes recorded" placeholder are internal tool bookkeeping,
      // not part of the official template — only print real notes when present.
      if (s.notes && s.notes.trim()){
        doc.setFont('PublicSans','normal'); doc.setFontSize(9.5); doc.setTextColor(ink[0],ink[1],ink[2]);
        var noteLines = doc.splitTextToSize(s.notes.trim(), contentW);
        noteLines.forEach(function(l){ doc.text(l, margin, y); y += 13; });
        y += 10;
      }
      var attached = ((state.filesByJob[state.activeId] || {})[a.key]) || [];
      var embeddable = [];
      attached.forEach(function(f){
        var kind = isEmbeddableFile(f);
        if (kind) embeddable.push(Object.assign({ kind: kind }, f));
      });
      var nonEmbeddable = attached.filter(function(f){ return !isEmbeddableFile(f); });
      if (nonEmbeddable.length){
        y = ensureSpace(y, 20 + nonEmbeddable.length*13);
        doc.setFont('PublicSans','bold'); doc.setFontSize(9); doc.setTextColor(ink[0],ink[1],ink[2]);
        doc.text('Attached (open separately — not viewable inline):', margin, y); y += 14;
        doc.setFont('PublicSans','normal'); doc.setFontSize(9);
        nonEmbeddable.forEach(function(f){
          doc.text('• ' + f.filename + ' (' + formatBytes(f.size||0) + ')', margin+4, y); y += 13;
        });
        y += 6;
      }
      var links = (s.links || []);
      if (links.length){
        y = ensureSpace(y, 20 + links.length*13);
        doc.setFont('PublicSans','bold'); doc.setFontSize(9); doc.setTextColor(ink[0],ink[1],ink[2]);
        doc.text('Linked files (live, not embedded):', margin, y); y += 14;
        doc.setFont('PublicSans','normal'); doc.setFontSize(9); doc.setTextColor(accent[0],accent[1],accent[2]);
        links.forEach(function(l){
          var lineText = '• ' + (l.label || l.url);
          var lines = doc.splitTextToSize(lineText, contentW-4);
          lines.forEach(function(ln){ y = ensureSpace(y, 13); doc.text(ln, margin+4, y); y += 13; });
        });
        doc.setTextColor(ink[0],ink[1],ink[2]);
        y += 6;
      }
      if (embeddable.length){
        embedPlan.push({ anchorPage: doc.internal.getNumberOfPages(), label: a.label, files: embeddable });
        // no extra doc.addPage() here — the next appendix (or end of doc) already starts its own
        // fresh page, and adding one here would leave a permanently blank page behind after merge.
      } else if (!attached.length && !links.length){
        doc.setFont('PublicSans','italic'); doc.setFontSize(8.5); doc.setTextColor(softInk[0],softInk[1],softInk[2]);
        doc.text('Nothing recorded for this appendix yet.', margin, y, { maxWidth: contentW });
      }
    });

    // ---- Fill in the Contents page now that every heading's real page number is known ----
    doc.setPage(tocPageNumber);
    var tocY = 90;
    doc.setFont('Newsreader','normal'); doc.setFontSize(16); doc.setTextColor(navy[0],navy[1],navy[2]);
    doc.text('Contents', margin, tocY);
    doc.setDrawColor(accent[0],accent[1],accent[2]); doc.setLineWidth(1.2);
    doc.line(margin, tocY+5, margin+26, tocY+5);
    tocY += 22 + 6;
    tocEntries.forEach(function(entry){
      doc.setFont('PublicSans', entry.bold ? 'bold' : 'normal');
      doc.setFontSize(entry.bold ? 10 : 9.5);
      doc.setTextColor(entry.bold ? navy[0] : ink[0], entry.bold ? navy[1] : ink[1], entry.bold ? navy[2] : ink[2]);
      var indent = entry.bold ? 0 : 14;
      var label = entry.text;
      var maxLabelW = contentW - indent - 34;
      var lines = doc.splitTextToSize(label, maxLabelW);
      var firstLine = lines[0];
      doc.text(firstLine, margin + indent, tocY);
      var labelW = doc.getTextWidth(firstLine);
      var pageStr = String(entry.page);
      var pageStrW = doc.getTextWidth(pageStr);
      var dotsX0 = margin + indent + labelW + 4;
      var dotsX1 = pageW - margin - pageStrW - 4;
      if (dotsX1 > dotsX0){
        doc.setFont('PublicSans','normal'); doc.setFontSize(9.5); doc.setTextColor(softInk[0],softInk[1],softInk[2]);
        var dotUnit = doc.getTextWidth('. ');
        var dotsCount = Math.max(0, Math.floor((dotsX1 - dotsX0) / dotUnit));
        doc.text(new Array(dotsCount+1).join('. '), dotsX0, tocY);
      }
      doc.setFont('PublicSans', entry.bold ? 'bold' : 'normal');
      doc.setTextColor(entry.bold ? navy[0] : ink[0], entry.bold ? navy[1] : ink[1], entry.bold ? navy[2] : ink[2]);
      doc.text(pageStr, pageW - margin, tocY, { align: 'right' });
      tocY += 15;
      for (var li=1; li<lines.length; li++){ doc.text(lines[li], margin+indent, tocY); tocY += 15; }
    });

    footerHeader(jobName);
    var fileSafeName = jobName.replace(/[^a-z0-9\-]+/gi,'_').replace(/^_+|_+$/g,'') || 'Job';
    var filename = 'VP-OAM_' + fileSafeName + '.pdf';
    var jobId = state.activeId;

    (async function(){
      var baseBytes = doc.output('arraybuffer');
      var finalBytes = baseBytes;
      var mergeFailures = [];

      if (embedPlan.length && window.PDFLib){
        try{
          toast('Assembling attached documents…');
          var merged = await window.PDFLib.PDFDocument.load(baseBytes);
          // process from the last anchor to the first so earlier insert points stay valid
          var plan = embedPlan.slice().sort(function(a,b){ return b.anchorPage - a.anchorPage; });
          for (var p = 0; p < plan.length; p++){
            var entry = plan[p];
            var insertAt = entry.anchorPage; // 0-based index right after the (1-based) anchor page
            for (var fIdx = 0; fIdx < entry.files.length; fIdx++){
              var f = entry.files[fIdx];
              try{
                var base64 = await readFileChunked(jobId, f.id, f);
                var binary = atob(base64);
                var bytes = new Uint8Array(binary.length);
                for (var bi=0; bi<binary.length; bi++) bytes[bi] = binary.charCodeAt(bi);
                if (f.kind === 'pdf'){
                  var srcDoc = await window.PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
                  if (srcDoc.isEncrypted && window.pdfjsLib){
                    // pdf-lib can't decrypt real encrypted PDFs — ignoreEncryption only skips the
                    // error, it still copies the still-scrambled content stream, which is why some
                    // certificates rendered as a blank/corrupt page. Rasterize with pdf.js instead
                    // (which CAN decrypt for rendering) and embed each page as a flattened image.
                    var pdfjsTask = window.pdfjsLib.getDocument({ data: bytes });
                    var pdfjsDoc = await pdfjsTask.promise;
                    for (var pnum = 1; pnum <= pdfjsDoc.numPages; pnum++){
                      var pjsPage = await pdfjsDoc.getPage(pnum);
                      var viewport = pjsPage.getViewport({ scale: 2 });
                      var canvas = document.createElement('canvas');
                      canvas.width = Math.ceil(viewport.width);
                      canvas.height = Math.ceil(viewport.height);
                      var ctx = canvas.getContext('2d');
                      await pjsPage.render({ canvasContext: ctx, viewport: viewport }).promise;
                      var pngDataUrl = canvas.toDataURL('image/png');
                      var pngBinary = atob(pngDataUrl.split(',')[1]);
                      var pngBytes = new Uint8Array(pngBinary.length);
                      for (var pbi=0; pbi<pngBinary.length; pbi++) pngBytes[pbi] = pngBinary.charCodeAt(pbi);
                      var rimg = await merged.embedPng(pngBytes);
                      var rPageA4 = [595.28, 841.89];
                      var rScale = Math.min((rPageA4[0]-36)/rimg.width, (rPageA4[1]-36)/rimg.height, 1);
                      var rDrawW = rimg.width*rScale, rDrawH = rimg.height*rScale;
                      var rNewPage = merged.insertPage(insertAt, rPageA4);
                      rNewPage.drawImage(rimg, { x:(rPageA4[0]-rDrawW)/2, y:(rPageA4[1]-rDrawH)/2, width: rDrawW, height: rDrawH });
                      insertAt++;
                    }
                  } else {
                    var copied = await merged.copyPages(srcDoc, srcDoc.getPageIndices());
                    for (var cp = 0; cp < copied.length; cp++){
                      merged.insertPage(insertAt, copied[cp]);
                      insertAt++;
                    }
                  }
                } else {
                  var img = (f.kind === 'png') ? await merged.embedPng(bytes) : await merged.embedJpg(bytes);
                  var imgW = img.width, imgH = img.height;
                  var pageA4 = [595.28, 841.89];
                  var scale = Math.min((pageA4[0]-72)/imgW, (pageA4[1]-72)/imgH, 1);
                  var drawW = imgW*scale, drawH = imgH*scale;
                  var page = merged.insertPage(insertAt, pageA4);
                  page.drawImage(img, { x:(pageA4[0]-drawW)/2, y:(pageA4[1]-drawH)/2, width: drawW, height: drawH });
                  insertAt++;
                }
              }catch(fileErr){
                mergeFailures.push(f.filename);
              }
            }
          }
          finalBytes = await merged.save();
        }catch(mergeErr){
          mergeFailures.push('(assembly error — exported with the summary pages only)');
        }
      }

      var blob = new Blob([finalBytes], { type: 'application/pdf' });
      browserDownloadBlob(filename, blob);
      toast(mergeFailures.length ? ('Exported with issues: ' + mergeFailures.join(', ')) : ('Manual exported: ' + filename));
    })();
  }

  /* ---------------- wiring: top-level ---------------- */
  function openSidebar(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarBackdrop').classList.add('show');
  }
  function closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('show');
  }
  var toggleBtn = document.getElementById('sidebarToggle');
  if (toggleBtn) toggleBtn.addEventListener('click', openSidebar);
  var backdropEl = document.getElementById('sidebarBackdrop');
  if (backdropEl) backdropEl.addEventListener('click', closeSidebar);

  document.getElementById('newJobBtn').addEventListener('click', function(){ createJob(); closeSidebar(); });
  document.getElementById('deleteJobBtn').addEventListener('click', confirmDeleteJob);
  document.getElementById('saveBtn').addEventListener('click', function(){
    if (!state.activeId){ toast('Select a job first'); return; }
    saveNow(state.activeId);
  });
  document.getElementById('exportBtn').addEventListener('click', exportPdf);
  document.getElementById('previewBtn').addEventListener('click', function(){
    var job = state.jobs[state.activeId];
    if (!job){ toast('Select a job first'); return; }
    openPreviewModal(job);
  });

  /* ---------------- db bootstrap ---------------- */
  function attachJobsListener(){
    syncConfirmed = false;
    if (unsubJobs) { try{ unsubJobs(); }catch(e){} unsubJobs = null; }
    try{
      attachJobsListenerInner();
    }catch(e){
      // onSnapshot threw synchronously instead of going through the error callback —
      // still fall back rather than leaving the sidebar on the empty placeholder.
      fallBackToLocal();
    }
  }

  function fallBackToLocal(){
    if (syncConfirmed) return;
    loadLocal();
    if (!state.activeId && state.order.length) state.activeId = state.order[0];
    renderJobList();
    renderJobDetail();
    setSyncStatus('stuck');
  }

  function attachJobsListenerInner(){
    unsubJobs = db.collection('jobs').onSnapshot(function(snap){
      syncConfirmed = true; // any delivery at all means the sidebar will actually render below
      var incomingIds = {};
      snap.docs.forEach(function(d){
        incomingIds[d.id] = true;
        // This job has an edit on THIS tab that hasn't been written yet (still inside the
        // debounce window, or its targeted update is in flight). The incoming snapshot is
        // now stale relative to what's on screen — applying it would overwrite exactly the
        // change the user is mid-typing. Skip it; the pending save will bring the server up
        // to date in a moment, and the NEXT snapshot after that reflects it correctly.
        if (saveTimers[d.id] || pendingChanges[d.id] || saveInFlight[d.id]) return;
        var data = d.data();
        if (!data) return;
        // normalize shape defensively
        data.builder = data.builder || { name:'',address:'',phone:'',fax:'',email:'' };
        data.equipment = data.equipment || [];
        data.sections = data.sections || {};
        APPENDICES.forEach(function(a){
          if (!data.sections[a.key]) data.sections[a.key] = { status:'pending', notes:'', links:[] };
          if (!data.sections[a.key].links) data.sections[a.key].links = [];
        });
        state.jobs[d.id] = data;
        if (state.order.indexOf(d.id) === -1) state.order.push(d.id);
      });
      // Remove jobs that no longer exist server-side — but ONLY once we're sure this
      // snapshot is the real, complete picture. The first delivery after a page load
      // (or any delivery during a connectivity gap) can be `fromCache`: an incomplete
      // or stale local view, not a confirmed "these are the only jobs left". Treating
      // that as truth is exactly how a job manual could flash empty or vanish from the
      // list even though it was never touched on the server — a definitive snapshot
      // always follows, so we just wait for it before deleting anything from view.
      if (!snap.metadata.fromCache){
        state.order = state.order.filter(function(id){ return incomingIds[id]; });
        Object.keys(state.jobs).forEach(function(id){
          if (!incomingIds[id]) delete state.jobs[id];
        });
      }
      // sort by updatedAt desc
      state.order.sort(function(a,b){
        var ja = state.jobs[a], jb = state.jobs[b];
        return new Date(jb.updatedAt||0) - new Date(ja.updatedAt||0);
      });
      var prevActive = state.activeId;
      if (!state.activeId && state.order.length) state.activeId = state.order[0];
      if (state.activeId && !state.jobs[state.activeId]) state.activeId = state.order.length ? state.order[0] : null;
      if (state.activeId && state.activeId !== prevActive) refreshFiles(state.activeId);
      renderJobList();
      // Skip rebuilding the open job's form while it has an edit still in flight — even
      // though the data above wasn't touched, tearing down and rebuilding the inputs mid-type
      // loses focus and caret position for no reason.
      if (!state.activeId || !(saveTimers[state.activeId] || pendingChanges[state.activeId] || saveInFlight[state.activeId])){
        renderJobDetail();
      }
      setSyncStatus('live');
    }, function(err){
      // The live subscription died (or never connected) — this is exactly the state that
      // left the sidebar showing nothing but the static "Jobs" placeholder: renderJobList()
      // had never run yet, because until now it only ran from inside a successful snapshot.
      // Fall back to whatever this browser has saved locally and actually render it, instead
      // of leaving the screen blank with no explanation. Uses the persistent footer message
      // (with a Retry button) rather than a toast, since a toast disappears in ~2s and is
      // easy to miss if you're not looking right at that moment.
      fallBackToLocal();
    });
    // Safety net: if the subscription neither delivers a snapshot nor reports an error
    // within a few seconds (a hung connection), don't leave the sidebar sitting on the
    // static placeholder indefinitely — fall back to the local copy and say so.
    setTimeout(fallBackToLocal, 4000);
  }

  async function boot(){
    setSyncStatus('connecting');
    // This build talks directly to our own Firebase project instead of the Claude Artifact
    // "db" bridge — that's the whole point of moving here: Firestore's real connection
    // doesn't depend on the Claude artifact runtime being up, so the "Connecting… forever"
    // problem that motivated this move shouldn't recur. sampleCap (Claude's image-scan
    // capability) simply doesn't exist outside a Claude Artifact, so it stays null — the
    // WSD image-scan button won't offer itself, and the fallback copy already tells people
    // to send the WSD PDF to Claude in chat instead, which still works fine.
    try{
      if (!window.firebase){ throw new Error('Firebase SDK did not load'); }
      var app = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(firebaseConfig);
      db = firebase.firestore(app);
    }catch(e){ db = null; }

    if (db){
      attachJobsListener();
    } else {
      loadLocal();
      setSyncStatus('local');
      if (!state.order.length){
        // no seed jobs — genuinely empty until the user creates one
      } else {
        if (!state.activeId) state.activeId = state.order[0];
      }
      renderJobList();
      renderJobDetail();
    }
  }

  boot();
})();
